<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

    main{max-width:470px;width:100%;border:1px solid #806025;border-radius:14px;background:#130d07;padding:42px 30px;text-align:center}

    h1{color:#ffd764;font-size:24px;letter-spacing:3px;margin:0 0 20px}

    a{display:block;margin-top:24px;padding:15px 24px;border-radius:6px;background:#eac451;color:#1c1205;font-weight:bold;letter-spacing:2px;text-transform:uppercase;text-decoration:none}

  <link rel="stylesheet" href="luxury-pages.css">

<body class="luxury-auth luxury-gate">
  <main>
    <div class="suit" aria-hidden="true">♠</div>
    <h1>YOU'RE READY TO PLAY</h1>
    <p>You don't need to upload a government ID or selfie to play Blackjack Casino Royale.</p>
    <p class="subtle">Players must still be 21 or older. Your date of birth is requested at registration. This is self-reported and is not independent age verification.</p>
    <a id="continue" href="blackjack.html">Continue to Blackjack</a>

  <script>
